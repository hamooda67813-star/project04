<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mohammed - Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="profile-card">

        <img
            class="profile-image"
            src="assets/profile.jpg"
            alt="Profile photo"
        >

        <h1 id="name">Mohammed</h1>

        <h2 id="job">Computer Engineering Student</h2>

        <p id="description">
            Welcome to my personal portfolio.
        </p>

        <section class="info">

            <h3 id="aboutTitle">About Me</h3>

            <p id="aboutText">
                I am a Computer Engineering student interested in
                technology and programming.
            </p>

        </section>

        <section class="hobbies">

            <h3 id="hobbiesTitle">My Hobbies</h3>

            <ul>
                <li id="hobby1">Going to the gym</li>
                <li id="hobby2">Playing football</li>
                <li id="hobby3">Reading books</li>
                <li id="hobby4">Writing expressions</li>
            </ul>

        </section>

        <button id="languageButton">
            العربية
        </button>

    </main>

    <script src="script.js"></script>

</body>

</html>
